<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Risk Analyzer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-in;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.8s ease-out;
        }

        .input-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input, select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .activity-selector {
            margin-bottom: 30px;
        }

        .activity-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .activity-btn {
            padding: 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .activity-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .activity-btn.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .analyze-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .analyze-btn:active {
            transform: translateY(0);
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }

        .risk-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .risk-card {
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .risk-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: currentColor;
        }

        .risk-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .risk-card.low {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .risk-card.moderate {
            background: #fff3e0;
            color: #ef6c00;
        }

        .risk-card.high {
            background: #ffebee;
            color: #c62828;
        }

        .risk-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .risk-title {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .risk-percentage {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .risk-label {
            font-size: 0.9em;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .summary-section {
            background: #f5f5f5;
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .summary-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .summary-text {
            line-height: 1.8;
            color: #555;
        }

        .recommendation {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .recommendation-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .map-section {
            margin-bottom: 30px;
        }

        .map-container {
            height: 400px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border: 3px solid #e0e0e0;
        }

        .map-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.95em;
            color: #666;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .main-card {
                padding: 25px;
            }
            
            .input-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather Risk Analyzer</h1>
            <p class="subtitle">Plan your outdoor events with confidence</p>
        </header>

        <div class="main-card">
            <div class="map-section">
                <label>🗺️ Select Location on Map</label>
                <div class="map-container" id="map"></div>
                <div class="map-info">
                    <strong>💡 Tip:</strong> Click anywhere on the map to set your location, or type in the location field below.
                </div>
            </div>

            <div class="input-section">
                <div class="input-group">
                    <label for="location">📍 Location</label>
                    <input type="text" id="location" placeholder="Enter city or coordinates" required>
                </div>
                
                <div class="input-group">
                    <label for="date">📅 Date</label>
                    <input type="date" id="date" required>
                </div>
                
                <div class="input-group">
                    <label for="duration">⏱️ Duration (days)</label>
                    <input type="number" id="duration" min="1" max="14" value="1">
                </div>
            </div>

            <div class="activity-selector">
                <label>🎯 Activity Type</label>
                <div class="activity-buttons">
                    <button class="activity-btn" data-activity="hiking">🥾 Hiking</button>
                    <button class="activity-btn" data-activity="fishing">🎣 Fishing</button>
                    <button class="activity-btn" data-activity="camping">⛺ Camping</button>
                    <button class="activity-btn" data-activity="beach">🏖️ Beach</button>
                    <button class="activity-btn" data-activity="cycling">🚴 Cycling</button>
                    <button class="activity-btn" data-activity="general">🌳 General</button>
                </div>
            </div>

            <button class="analyze-btn" onclick="analyzeWeather()">Analyze Weather Risk</button>

            <div class="results" id="results">
                <div class="risk-grid" id="riskGrid"></div>
                
                <div class="summary-section">
                    <div class="summary-title">📊 Analysis Summary</div>
                    <div class="summary-text" id="summaryText"></div>
                </div>

                <div class="recommendation">
                    <div class="recommendation-title">💡 Recommendation</div>
                    <div id="recommendationText"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedActivity = 'general';
        let map, marker;
        let selectedCoords = null;

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').setAttribute('min', today);
        document.getElementById('date').value = today;

        // Initialize map
        function initMap() {
            map = L.map('map').setView([20, 0], 2);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 18
            }).addTo(map);

            // Click event for map
            map.on('click', function(e) {
                const lat = e.latlng.lat.toFixed(4);
                const lng = e.latlng.lng.toFixed(4);
                
                selectedCoords = { lat, lng };
                
                if (marker) {
                    map.removeLayer(marker);
                }
                
                marker = L.marker([lat, lng]).addTo(map);
                marker.bindPopup(`<b>Selected Location</b><br>Lat: ${lat}, Lng: ${lng}`).openPopup();
                
                // Reverse geocode to get location name
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                    .then(response => response.json())
                    .then(data => {
                        const locationName = data.display_name.split(',').slice(0, 3).join(',');
                        document.getElementById('location').value = locationName;
                    })
                    .catch(() => {
                        document.getElementById('location').value = `${lat}, ${lng}`;
                    });
            });
        }

        // Initialize map when page loads
        window.addEventListener('load', initMap);

        // Location input search
        let searchTimeout;
        document.getElementById('location').addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            const query = e.target.value;
            
            if (query.length > 2) {
                searchTimeout = setTimeout(() => {
                    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                        .then(response => response.json())
                        .then(data => {
                            if (data && data.length > 0) {
                                const result = data[0];
                                const lat = parseFloat(result.lat);
                                const lng = parseFloat(result.lon);
                                
                                selectedCoords = { lat: lat.toFixed(4), lng: lng.toFixed(4) };
                                
                                map.setView([lat, lng], 10);
                                
                                if (marker) {
                                    map.removeLayer(marker);
                                }
                                
                                marker = L.marker([lat, lng]).addTo(map);
                                marker.bindPopup(`<b>${result.display_name}</b>`).openPopup();
                            }
                        });
                }, 500);
            }
        });

        // Activity selection
        document.querySelectorAll('.activity-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.activity-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selectedActivity = this.dataset.activity;
            });
        });

        // Set default activity
        document.querySelector('.activity-btn[data-activity="general"]').classList.add('selected');

        function analyzeWeather() {
            const location = document.getElementById('location').value;
            const date = document.getElementById('date').value;
            const duration = document.getElementById('duration').value;

            if (!location || !date) {
                alert('Please fill in location and date');
                return;
            }

            // Simulate weather risk calculation
            const risks = calculateRisks(location, date, duration, selectedActivity);
            displayResults(risks, location, date, duration);
        }

        function calculateRisks(location, date, duration, activity) {
            // Simulate risk calculation based on historical data patterns
            const dateObj = new Date(date);
            const month = dateObj.getMonth();
            const season = getSeason(month);
            
            // Base risk factors (simulated)
            let risks = {
                hot: Math.random() * 100,
                cold: Math.random() * 100,
                windy: Math.random() * 100,
                wet: Math.random() * 100,
                uncomfortable: Math.random() * 100
            };

            // Seasonal adjustments
            if (season === 'summer') {
                risks.hot += 30;
                risks.cold = Math.max(0, risks.cold - 40);
                risks.wet -= 10;
            } else if (season === 'winter') {
                risks.cold += 35;
                risks.hot = Math.max(0, risks.hot - 40);
                risks.wet += 15;
            } else if (season === 'spring' || season === 'fall') {
                risks.wet += 20;
                risks.windy += 10;
            }

            // Activity-specific adjustments
            if (activity === 'fishing' || activity === 'beach') {
                risks.windy += 10;
            }

            // Normalize to 0-100
            Object.keys(risks).forEach(key => {
                risks[key] = Math.min(100, Math.max(0, risks[key]));
            });

            return risks;
        }

        function getSeason(month) {
            if (month >= 2 && month <= 4) return 'spring';
            if (month >= 5 && month <= 7) return 'summer';
            if (month >= 8 && month <= 10) return 'fall';
            return 'winter';
        }

        function getRiskLevel(percentage) {
            if (percentage < 30) return 'low';
            if (percentage < 60) return 'moderate';
            return 'high';
        }

        function displayResults(risks, location, date, duration) {
            const riskGrid = document.getElementById('riskGrid');
            riskGrid.innerHTML = '';

            const riskData = [
                { key: 'hot', icon: '🌡️', title: 'Very Hot', value: risks.hot },
                { key: 'cold', icon: '❄️', title: 'Very Cold', value: risks.cold },
                { key: 'windy', icon: '💨', title: 'Very Windy', value: risks.windy },
                { key: 'wet', icon: '🌧️', title: 'Very Wet', value: risks.wet },
                { key: 'uncomfortable', icon: '😓', title: 'Uncomfortable', value: risks.uncomfortable }
            ];

            riskData.forEach(risk => {
                const level = getRiskLevel(risk.value);
                const card = document.createElement('div');
                card.className = `risk-card ${level}`;
                card.innerHTML = `
                    <div class="risk-icon">${risk.icon}</div>
                    <div class="risk-title">${risk.title}</div>
                    <div class="risk-percentage">${Math.round(risk.value)}%</div>
                    <div class="risk-label">${level} risk</div>
                `;
                riskGrid.appendChild(card);
            });

            // Generate summary
            const highestRisk = riskData.reduce((max, r) => r.value > max.value ? r : max);
            const avgRisk = riskData.reduce((sum, r) => sum + r.value, 0) / riskData.length;

            const summaryText = document.getElementById('summaryText');
            summaryText.innerHTML = `
                Based on historical weather patterns for <strong>${location}</strong> during this time of year,
                your ${duration}-day event starting on <strong>${new Date(date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</strong>
                shows a <strong>${Math.round(avgRisk)}%</strong> overall risk of adverse conditions.
                The highest concern is <strong>${highestRisk.title.toLowerCase()}</strong> conditions
                with a ${Math.round(highestRisk.value)}% likelihood.
            `;

            // Generate recommendation
            const recommendationText = document.getElementById('recommendationText');
            if (avgRisk < 30) {
                recommendationText.innerHTML = '✅ Excellent conditions expected! This is an ideal time for your outdoor event. Proceed with confidence, but always check the forecast closer to your date.';
            } else if (avgRisk < 60) {
                recommendationText.innerHTML = '⚠️ Moderate risk detected. Your event can proceed, but prepare contingency plans. Pack appropriate gear for ' + highestRisk.title.toLowerCase() + ' conditions and monitor weather updates regularly.';
            } else {
                recommendationText.innerHTML = '🚨 High risk of adverse conditions. Consider rescheduling if possible, or ensure you have robust backup plans. If proceeding, prepare thoroughly for ' + highestRisk.title.toLowerCase() + ' weather.';
            }

            document.getElementById('results').classList.add('show');
            document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
